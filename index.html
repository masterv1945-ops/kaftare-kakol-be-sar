async function cropImage(file, size, square) {
const url = URL.createObjectURL(file);
try {
const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
let sw = img.width, sh = img.height, sx = 0, sy = 0, w, h;
if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; w = h = size; }
else { const k = Math.min(1, size / Math.max(sw, sh)); w = Math.round(sw * k); h = Math.round(sh * k); }
const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
return await new Promise(res => cv.toBlob(res, 'image/jpeg', .85));
} finally { URL.revokeObjectURL(url); }
}

const speeds = [1, 1.5, 2];

const dur = () => (isFinite(au.duration) && au.duration > 0 ? au.duration : +box.dataset.dur || 0);
au.addEventListener('timeupdate', () => { const p = dur() ? au.currentTime / dur() : 0; bars.forEach((b, i) => b.classList.toggle('on', i / bars.length < p)); vt.textContent = fmtDur(au.currentTime); });

au.addEventListener('pause', () => { btn.textContent = '▶'; });

au.addEventListener('play', () => { const nw = box.querySelector('.vnew'); if (nw) { nw.remove(); SAFE(() => { const a = JSON.parse(localStorage.getItem('kaftarHeard') || '[]'); a.push(box.dataset.vid); localStorage.setItem('kaftarHeard', JSON.stringify(a.slice(-300))); }); } }, { once: true });
}

async function sendFile(file, forceKind, extra) {

if (b && b.size < file.size) file = new File([b], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
} catch (_) {}
}
if (file.size > 25 * 1024 * 1024) return toast('حجم فایل بیش از ۲۵ مگابایت است');
const ext = (file.name.split('.').pop() || 'bin').replace(/[^A-Za-z0-9]/g, '').slice(0, 8) || 'bin';
const path = `${activeId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
toast('در حال ارسال ' + (file.name || 'فایل') + '…');
const { error } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type || 'application/octet-stream' });

}
async function toggleRecord() {
const btn = $('#recBtn');
if (recorder) { recorder.stop(); return; }
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
const rec = new MediaRecorder(stream); const chunks = []; const levels = [];
let an = null, ac = null, iv = null;
try {
ac = new (window.AudioContext || window.webkitAudioContext)(); an = ac.createAnalyser(); an.fftSize = 512;
ac.createMediaStreamSource(stream).connect(an);
const buf = new Uint8Array(an.fftSize);
iv = setInterval(() => { an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) s += Math.abs(v - 128); levels.push(s / buf.length); sendTyping('voice'); }, 150);
} catch (_) {}
const t0 = Date.now();
rec.ondataavailable = e => chunks.push(e.data);
rec.onstop = () => {
clearInterval(iv); try { ac && ac.close(); } catch (_) {}
stream.getTracks().forEach(t => t.stop());
recorder = null; btn.classList.remove('rec'); btn.innerHTML = icon('mic');
const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
const dur = (Date.now() - t0) / 1000;
const N = 36, wave = [];
for (let i = 0; i < N; i++) { const a = levels.slice(Math.floor(i * levels.length / N), Math.max(Math.floor((i + 1) * levels.length / N), Math.floor(i * levels.length / N) + 1)); const v = a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; wave.push(Math.round(Math.min(100, 12 + v * 9))); }
if (blob.size > 800) sendFile(new File([blob], 'voice.webm', { type: blob.type }), 'voice', { dur: Math.round(dur), wave });
};
rec.start(); recorder = rec; btn.classList.add('rec'); btn.innerHTML = icon('send');
toast('در حال ضبط… برای ارسال دوباره بزنید');
} catch (_) { toast('دسترسی به میکروفون داده نشد'); }
}

.on('postgres_changes', { event: '*', schema: 'public', table: 'message_reactions' }, onReact)

.on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, refreshConvs)

function onMsg(p) {

if (act === 'min') { room.min = true; showRoom(); }
if (act === 'leave') { if (room.r.owner_id === me.id && confirm('اتاق برای همه بسته شود؟ (برای فقط خروج «لغو» بزنید)')) { await sb.rpc('room_close', { rid: room.id }); } leaveRoom(); }
if (act === 'link') { try { await navigator.clipboard.writeText(roomLink(room.id)); toast('لینک اتاق کپی شد'); } catch (_) { prompt('لینک اتاق:', roomLink(room.id)); } }
if (act === 'members') roomMembers();
if (act === 'set') roomSettings();
if (act === 'play') { if (!(s.queue || []).length) return toast('اول چیزی به صف اضافه کنید'); pushState({ playing: !s.playing, pos }); }
if (act === 'next') { if ((s.idx || 0) < (s.queue || []).length - 1) pushState({ idx: s.idx + 1, pos: 0, playing: true }); }
if (act === 'prev') { if (pos > 4 || !s.idx) pushState({ pos: 0 }); else pushState({ idx: s.idx - 1, pos: 0, playing: true }); }
if (act === 'repeat') pushState({ repeat: !s.repeat, pos, playing: !!s.playing });
if (act === 'rate') { const i = RATES.indexOf(s.rate || 1); pushState({ rate: RATES[(i + 1) % RATES.length], pos, playing: !!s.playing }); }
if (act === 'subs') $('#rSubF').click();
if (act === 'pick') $('#rLocalF').click();
if (act === 'full') {
const box = $('#rPlayer');
if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
else if (box.requestFullscreen || box.webkitRequestFullscreen) {
const pr = (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
Promise.resolve(pr).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} }).catch(() => {});
}
else if (room.v.webkitEnterFullscreen) { room.v.webkitEnterFullscreen(); }
}
if (act === 'add') addToQueue();
}
async function roomChange(e) {
if (e.target.id === 'rSeek') { if (canCtl()) { const s = room.r.state || {}; pushState({ pos: +e.target.value, playing: !!s.playing }); } return; }
if (e.target.id === 'rSubF') {
const f = e.target.files[0]; if (!f) return; const txt = await f.text(); room.subs = parseSubs(txt); toast(room.subs.length ? 'زیرنویس فقط برای شما بارگذاری شد' : 'زیرنویس خوانده نشد'); e.target.value = ''; return;
}
if (e.target.id === 'rLocalF') {
const f = e.target.files[0]; if (!f) return; const it = ((room.r.state || {}).queue || [])[(room.r.state || {}).idx];
if (it) { room.local[it.id] = URL.createObjectURL(f); room.cur = null; applyState(); } e.target.value = '';
}
}
function roomMembers() {
const own = room.r.owner_id === me.id, on = new Set(Object.keys(room.online || {}));
openModal(`<div class="card"><h3 style="margin:0 0 10px">اعضای اتاق</h3>${room.members.map(id => `<div class="mrow">${uAv(id, on.has(id), 'sm')}<span>${esc(nameOf(id))}${id === room.r.owner_id ? ' <small class="role">میزبان</small>' : ''}${on.has(id) ? '' : ' <small>(آفلاین)</small>'}</span>${own && id !== me.id ? `<button type="button" class="ib" data-kick="${id}" title="حذف">${icon('x')}</button>` : ''}</div>`).join('')}
<button class="btn" type="button" id="mX" style="margin-top:12px">بستن</button></div>`);
$('#mX').onclick = closeModal;
$('#modal').onclick = async e => { const k = e.target.closest('[data-kick]'); if (!k || !room) return; if (!confirm('این نفر از اتاق حذف شود؟')) return; await sb.rpc('room_kick', { rid: room.id, uid: k.dataset.kick }); closeModal(); toast('حذف شد'); };
}
function roomSettings() {
const r = room.r;
openModal(`<form class="card" id="rsF"><h3 style="margin:0 0 10px">تنظیمات اتاق</h3>
<label class="f">نام اتاق<input id="rsT" maxlength="60" value="${esc(r.title)}"></label>
<label class="sw"><span>کنترل پخش فقط با میزبان</span><input type="checkbox" id="rsH" ${r.host_only ? 'checked' : ''}></label>
<label class="sw"><span>ورود با لینک برای هر کاربر</span><input type="checkbox" id="rsL" ${r.link_open ? 'checked' : ''}></label>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" type="submit">ذخیره</button><button class="btn ghost" type="button" id="rsX">بستن</button></div></form>`);
$('#rsX').onclick = closeModal;
$('#rsF').onsubmit = async e => { e.preventDefault(); const { error } = await sb.rpc('room_settings', { rid: room.id, p_title: $('#rsT').value.trim() || r.title, p_host_only: $('#rsH').checked, p_link_open: $('#rsL').checked }); if (error) return toast('ذخیره نشد'); closeModal(); toast('ذخیره شد'); };
}
function embedOf(u) {
let m = /aparat\.com\/v\/([A-Za-z0-9]+)/.exec(u) || /aparat\.com\/video\/video\/embed\/videohash\/([A-Za-z0-9]+)/.exec(u);
if (m) return { name: 'آپارات: ' + m[1], src: 'https://www.aparat.com/video/video/embed/videohash/' + m[1] + '/vt/frame' };
m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(u);
if (m) return { name: 'یوتیوب: ' + m[1], src: 'https://www.youtube.com/embed/' + m[1] };
return null;
}
function addToQueue() {
openModal(`<div class="card"><h3 style="margin:0 0 10px">افزودن به صف</h3>
<label class="btn" style="display:block;text-align:center;margin-bottom:8px">⬆ آپلود فایل برای همه (تا ۵۰ مگابایت)<input type="file" id="aUp" accept="video/*,audio/*" hidden></label>
<label class="btn ghost" style="display:block;text-align:center;margin-bottom:8px">💻 فایل محلی (هر نفر خودش همان فایل را انتخاب می‌کند)<input type="file" id="aLoc" accept="video/*,audio/*" hidden></label>
<form id="aUrlF" style="display:flex;gap:6px"><input id="aUrl" dir="ltr" placeholder="لینک مستقیم mp4 / mp3 / webm" style="flex:1"><button class="btn" type="submit">افزودن</button></form>
<button class="btn ghost" type="button" id="aX" style="margin-top:10px">بستن</button></div>`);
$('#aX').onclick = closeModal;
const push = async it => {
const s = room.r.state || {}, q = (s.queue || []).slice(); q.push(it);
const patch = { queue: q };
if (q.length === 1) Object.assign(patch, { idx: 0, pos: 0, playing: false });
await pushState(patch);
};
const kindOf = f => /^audio/.test(f.type) || /\.(mp3|m4a|aac|ogg|oga|wav|flac|opus)$/i.test(f.name) ? 'audio' : 'video';
const rid = () => Math.random().toString(36).slice(2, 9);
$('#aUp').onchange = async e => {
const f = e.target.files[0]; if (!f) return;
if (f.size > 50 * 1024 * 1024) return toast('حجم فایل بیش از ۵۰ مگابایت است');
toast('در حال آپلود…');
const ext = (f.name.split('.').pop() || 'bin').replace(/[^A-Za-z0-9]/g, '').slice(0, 6) || 'bin';
const path = room.id + '/' + Date.now() + '-' + rid() + '.' + ext;
const { error } = await sb.storage.from('rooms').upload(path, f, { contentType: f.type || undefined });
if (error) return toast('آپلود نشد: ' + error.message);
closeModal(); push({ id: rid(), name: f.name.slice(0, 80), kind: kindOf(f), type: 'path', src: path });
};
$('#aLoc').onchange = e => {
const f = e.target.files[0]; if (!f) return; const id = rid();
room.local[id] = URL.createObjectURL(f); closeModal(); push({ id, name: f.name.slice(0, 80), kind: kindOf(f), type: 'local' });
};
$('#aUrlF').onsubmit = e => {
e.preventDefault(); const u = $('#aUrl').value.trim();
if (!/^https?:\/\//i.test(u)) return toast('لینک معتبر نیست');
const em = embedOf(u);
if (em) { closeModal(); push({ id: rid(), name: em.name, kind: 'video', type: 'embed', src: em.src }); return; }
closeModal(); push({ id: rid(), name: decodeURIComponent(u.split('/').pop().split('?')[0] || u).slice(0, 80), kind: /\.(mp3|m4a|aac|ogg|oga|wav|flac|opus)(\?|$)/i.test(u) ? 'audio' : 'video', type: 'url', src: u });
};
}
let fsT = null;
function fsWake() {
const pl = $('#rPlayer'); if (!pl) return;
pl.classList.remove('hidec'); clearTimeout(fsT);
if (document.fullscreenElement === pl || document.webkitFullscreenElement === pl) fsT = setTimeout(() => pl.classList.add('hidec'), 3500);
}
function onFsChange() {
const pl = $('#rPlayer'); if (!pl) return;
const on = document.fullscreenElement === pl || document.webkitFullscreenElement === pl;
pl.classList.toggle('isfs', on); clearTimeout(fsT);
if (on) fsWake(); else { pl.classList.remove('hidec'); try { screen.orientation.unlock(); } catch (_) {} }
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('pointermove', e => { if (document.fullscreenElement && e.target.closest && e.target.closest('#rPlayer')) fsWake(); });
document.addEventListener('click', e => {
const pl = $('#rPlayer'); if (!pl || !pl.classList.contains('isfs')) return;
if (e.target.closest('#rPlayer')) fsWake();
});
function showRoom() {
const el = $('#room'), mini = $('#roomMini'); if (!room) { el.hidden = true; mini.hidden = true; document.body.classList.remove('inroom'); return; }
el.hidden = room.min; mini.hidden = !room.min; document.body.classList.toggle('inroom', !room.min);
if (room.min) {
const s = room.r.state || {};
mini.innerHTML = `<span>🎬 ${esc(room.r.title)}${s.playing ? ' · در حال پخش' : ''}</span><button type="button" class="btn" data-rm="open">بازگشت</button><button type="button" class="ib" data-rm="leave" aria-label="خروج">${icon('x')}</button>`;
}
}
$('#roomMini').addEventListener('click', e => {
const b = e.target.closest('[data-rm]'); if (!b || !room) return;
if (b.dataset.rm === 'open') { room.min = false; showRoom(); } else leaveRoom();
});
async function leaveRoom() {
const r = room; if (!r) return; room = null;
clearInterval(r.tick); clearInterval(r.seekT);
try { if (r.ch) { r.ch.untrack(); sb.removeChannel(r.ch); } } catch (_) {}
try { r.v.pause(); r.v.removeAttribute('src'); r.v.load(); } catch (_) {}
Object.values(r.local || {}).forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} });
const el = $('#room'); el.hidden = true; el.innerHTML = ''; $('#roomMini').hidden = true; document.body.classList.remove('inroom');
}
setInterval(() => { if (activeId && !document.hidden) renderRoomBar(); }, 20000);
})();</script>
</body>
