<!-- ============ auth ============ -->
<section id="auth" hidden>
  <div class="card">
    <div class="brand"><div class="logo" aria-hidden="true"><svg class="pigeon" viewBox="0 -20 400 400" aria-hidden="true"><use href="#pigeon"/></svg></div><h1>کفتر کاکل به سر</h1></div>
    <p class="sub">پیام‌رسان خصوصی با تماس صوتی و تصویری</p>
    <div class="seg" role="tablist">
      <button id="tabIn" class="on" type="button">ورود</button>
      <button id="tabUp" type="button">ثبت‌نام</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label class="f" id="fName" hidden>نام نمایشی
        <input id="inName" autocomplete="name" maxlength="40" placeholder="مثلاً سجاد">
      </label>
      <label class="f" id="fUser" hidden>نام کاربری (انگلیسی، حداقل ۳ حرف)
        <input id="inUser" dir="ltr" autocomplete="username" maxlength="32" pattern="[A-Za-z0-9_.]{3,32}" placeholder="sajad_1">
      </label>
      <label class="f">ایمیل
        <input id="inEmail" type="email" dir="ltr" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label class="f">رمز عبور
        <input id="inPass" type="password" dir="ltr" autocomplete="current-password" minlength="6" required>
      </label>
      <div class="err" id="authErr" role="alert"></div>
      <button class="btn block" id="authBtn" type="submit">ورود</button>
    </form>
    <p class="sub" style="font-size:11px;margin:16px 0 0;text-align:center">نسخه ۱۱</p>
    <form id="otpForm" hidden autocomplete="off">
      <p class="sub" id="otpInfo"></p>
      <label class="f">کد تأیید
        <input id="inCode" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required placeholder="------" style="letter-spacing:.35em;text-align:center;font-size:22px;font-weight:700">
      </label>
      <div class="err" id="otpErr" role="alert"></div>
      <button class="btn block" id="otpBtn" type="submit">تأیید ایمیل</button>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn ghost" style="flex:1" type="button" id="otpResend">ارسال دوباره کد</button>
        <button class="btn ghost" style="flex:1" type="button" id="otpBack">بازگشت</button>
      </div>
    </form>
  </div>
</section>
