<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کفتر کاکل به سر</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%8A%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar of chats + main thread, full-screen call overlay. Pigeon-grey surfaces, iridescent teal accent. */
:root{
  --bg:#e9edf0; --panel:#ffffff; --panel-2:#f4f6f8; --line:#d9e0e5;
  --ink:#1a2830; --ink-2:#5b6b75; --accent:#2a8a82; --accent-ink:#ffffff;
  --own:#2a8a82; --own-ink:#ffffff; --danger:#d2473f; --ok:#2f9e5b;
  --shadow:0 8px 28px rgba(20,40,50,.16);
  --font:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1619; --panel:#172126; --panel-2:#1d2a30; --line:#27363d;
    --ink:#e5eef2; --ink-2:#8fa3ad; --accent:#3fb3a8; --accent-ink:#06201d;
    --own:#1f6f69; --own-ink:#f2fffd; --danger:#ef6b63; --ok:#52c283;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;display:block}

/* ---------- auth ---------- */
#auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(420px,100%);padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#6a5acd);display:grid;place-items:center;font-size:26px}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--ink-2);margin:0 0 20px;font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:8px;border-radius:9px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
label.f input{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
label.f input[dir=ltr]{text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.block{width:100%}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:6px 0}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:350px 1fr;height:100%;height:100dvh}
#side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:start}
.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.me small{color:var(--ink-2);font-size:12px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{padding:10px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:700}
#list{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:start;position:relative}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--panel-2)}
.rm{flex:1;min-width:0}
.rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rt time{font-size:11.5px;color:var(--ink-2);flex:none}
.rp{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.av{--h:180;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:hsl(var(--h) 38% 42%);position:relative;font-size:17px}
.av.sm{width:36px;height:36px;font-size:14px}
.av .on{position:absolute;bottom:0;inset-inline-end:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.hint{padding:24px 18px;color:var(--ink-2);font-size:13.5px;text-align:center}
.side-f{padding:10px 14px;border-top:1px solid var(--line)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.empty{margin:auto;text-align:center;color:var(--ink-2);padding:24px}
.empty .big{font-size:56px}
.chat-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chat-h .t{flex:1;min-width:0}
.chat-h .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .t small{color:var(--ink-2);font-size:12px}
.back{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:0}
.m{max-width:min(520px,84%);align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;border-end-start-radius:4px;padding:7px 12px;position:relative}
.m.mine{align-self:flex-start;background:var(--own);color:var(--own-ink);border-color:transparent;border-end-start-radius:16px;border-end-end-radius:4px}
.m .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:1px}
.m .body{white-space:pre-wrap;overflow-wrap:anywhere}
.m .meta{font-size:11px;opacity:.7;margin-top:2px;text-align:end}
.m .del{font-style:italic;opacity:.65}
.m .q{border-inline-start:3px solid var(--accent);background:rgba(127,127,127,.14);border-radius:6px;padding:2px 8px;margin-bottom:4px;font-size:12.5px;opacity:.9}
.m img,.m video{display:block;max-width:100%;max-height:340px;border-radius:10px;margin:2px 0}
.m audio{display:block;width:min(260px,100%)}
.m .file{display:flex;align-items:center;gap:8px;text-decoration:underline;cursor:pointer}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx button{font-size:13px;padding:0 8px;border-radius:999px;background:rgba(127,127,127,.18);border:1px solid transparent}
.rx button.me{border-color:var(--accent)}
.acts{position:absolute;top:-14px;inset-inline-end:8px;display:none;gap:2px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 4px;box-shadow:var(--shadow);z-index:2}
.m:hover .acts,.m.show .acts{display:flex}
.acts button{width:28px;height:28px;border-radius:50%;font-size:14px;display:grid;place-items:center}
.acts button:hover{background:var(--panel-2)}
.pick{display:none;gap:2px}
.m.pick-on .pick{display:flex}
.day{align-self:center;font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);padding:1px 12px;border-radius:999px;margin:6px 0}
.sys{align-self:center;font-size:12.5px;color:var(--ink-2)}

.reply-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.reply-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--accent);padding-inline-start:8px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:9px 14px;border-radius:21px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);line-height:1.5}
.composer .ib.send{background:var(--accent);color:var(--accent-ink)}
.composer .ib.rec{background:var(--danger);color:#fff}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
#modal .card{max-height:90dvh;overflow:auto}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
#toast{position:fixed;inset-inline:0;bottom:24px;display:flex;justify-content:center;pointer-events:none;z-index:99}
#toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:13.5px}

/* ---------- call ---------- */
#callui{position:fixed;inset:0;background:#0a1114;color:#fff;z-index:80;display:flex;flex-direction:column}
#tiles{position:absolute;inset:0;display:grid;gap:6px;padding:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:1fr}
#tiles.solo{display:block;padding:0}
.tile{position:relative;background:#16242a;border-radius:14px;overflow:hidden;min-height:0;display:grid;place-items:center}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.novid video{visibility:hidden}
.tile .av{width:84px;height:84px;font-size:34px;position:relative;z-index:1}
.tile.me video{transform:scaleX(-1)}
.tile .tn{position:absolute;bottom:8px;inset-inline-start:10px;font-size:12.5px;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:999px;z-index:2}
.tile .ts{position:absolute;top:8px;inset-inline-end:10px;font-size:11.5px;background:rgba(0,0,0,.5);padding:0 8px;border-radius:999px;z-index:2}
.tile .ts:empty{display:none}
#tiles.solo .tile{position:absolute;inset:0;border-radius:0}
#tiles.solo .tile:not(.me) .av,#tiles.solo .tile:not(.me) .tn{display:none}
#tiles.solo .tile.me{inset:auto;top:max(16px,env(safe-area-inset-top,0px));inset-inline-start:16px;width:min(140px,30vw);aspect-ratio:3/4;border-radius:14px;border:2px solid rgba(255,255,255,.35);z-index:3}
#tiles.solo.audio .tile.me{display:none}
#gtop{position:relative;z-index:3;text-align:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top,0px));font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#callui:not(.grp) #gtop,#callui.grp #callinfo{display:none}
#diag{position:relative;z-index:3;font-size:10.5px;opacity:.55;text-align:center;padding:0 10px 2px;word-break:break-word}
.callbanner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-size:13.5px}
.callbanner span{flex:1}
.callbanner .btn{background:#fff;color:#111;padding:4px 14px}
.callbanner[hidden]{display:none}
.m img[data-path]{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.94);display:flex;flex-direction:column;color:#fff}
#lb[hidden]{display:none}
#lbBar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px))}
#lbBar .ib{color:#fff;background:rgba(255,255,255,.14);text-decoration:none;font-size:18px}
#lbCap{flex:1;min-width:0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lbStage{flex:1;min-height:0;overflow:auto;display:flex;position:relative}
#lbImg{margin:auto;max-width:100%;max-height:calc(100dvh - 70px);object-fit:contain;cursor:zoom-in}
#lbImg:not([src]){visibility:hidden}
#lbImg.zoom{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.lbnav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:30px;line-height:1;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;z-index:2}
.lbnav[hidden]{display:none}
#lbPrev{right:10px}#lbNext{left:10px}
#callinfo{position:relative;z-index:1;margin:auto;text-align:center;padding:24px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#callinfo .av{width:110px;height:110px;font-size:44px;margin:0 auto 14px}
#callinfo h2{margin:0;font-size:24px}
#callinfo p{margin:4px 0 0;opacity:.85}
#callbar{margin-top:auto;position:relative;z-index:2;display:flex;justify-content:center;gap:16px;padding:20px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.cb{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.cb.off{background:#fff;color:#111}
.cb.hang{background:var(--danger)}
.cb.hang svg{transform:rotate(135deg)}
.cb.ok{background:var(--ok)}
#incoming{position:fixed;inset-inline:0;top:max(12px,env(safe-area-inset-top,0px));display:flex;justify-content:center;padding:0 12px;z-index:90}
#incoming .card{display:flex;align-items:center;gap:14px;padding:14px 16px;width:min(440px,100%)}
#incoming .who{flex:1;min-width:0}
#incoming .who b{display:block}
#incoming .who small{color:var(--ink-2)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
#incoming .av{animation:ring 1.2s infinite}
@media (prefers-reduced-motion:reduce){#incoming .av{animation:none}}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #app.chat-open #side{display:none}
  #app:not(.chat-open) #main{display:none}
  .back{display:grid}
  .m{max-width:90%}
  .acts{top:-16px}
}

/* ---------- theme override ---------- */
:root[data-theme=dark]{--bg:#0f1619;--panel:#172126;--panel-2:#1d2a30;--line:#27363d;--ink:#e5eef2;--ink-2:#8fa3ad;--accent:#3fb3a8;--accent-ink:#06201d;--own:#1f6f69;--own-ink:#f2fffd;--danger:#ef6b63;--ok:#52c283;--shadow:0 8px 28px rgba(0,0,0,.5)}
:root[data-theme=light]{--bg:#e9edf0;--panel:#ffffff;--panel-2:#f4f6f8;--line:#d9e0e5;--ink:#1a2830;--ink-2:#5b6b75;--accent:#2a8a82;--accent-ink:#ffffff;--own:#2a8a82;--own-ink:#ffffff;--danger:#d2473f;--ok:#2f9e5b;--shadow:0 8px 28px rgba(20,40,50,.16)}
/* ---------- chat features ---------- */
.av{overflow:visible}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.gs{padding:8px 12px 0}
.gs input{width:100%;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chips button{flex:none;padding:3px 12px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);font-size:12.5px}
.chips button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-style:normal;font-weight:700;display:grid;place-items:center;flex:none}
.badge.mute{background:var(--ink-2)}
.pinned{font-style:normal;font-size:12px;flex:none}
.typing{color:var(--accent)!important}
.chat-h .hd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:start}
.pinbar{display:flex;align-items:center;gap:8px;padding:4px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pinbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--accent);padding-inline-start:8px}
.sbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:6px}
.sbar input{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
#sRes{grid-column:1/-1;max-height:240px;overflow:auto}
#sRes button{display:block;width:100%;text-align:start;padding:6px 8px;border-radius:8px;font-size:13px}
#sRes button:hover{background:var(--panel-2)}
#msgs{background-color:var(--bg);background-image:var(--wall,none);background-size:cover;background-position:center}
.tobottom{position:absolute;inset-inline-start:16px;bottom:84px;width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);z-index:5}
#main{position:relative}
.older{align-self:center;padding:4px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.unread{align-self:stretch;text-align:center;font-size:12px;color:var(--accent);border-block:1px dashed var(--accent);padding:2px;margin:6px 0}
.m{transition:transform .15s}
.m.flash{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.mm{position:absolute;top:2px;inset-inline-end:6px;opacity:0;font-size:16px;line-height:1;padding:2px 6px;border-radius:8px;color:inherit}
.m:hover .mm{opacity:.7}
@media (hover:none){.mm{opacity:.45}}
.fwd{font-size:11.5px;opacity:.75;font-style:italic}
.q{cursor:pointer}
.sp{background:currentColor;border-radius:4px;cursor:pointer}
.sp:not(.on){color:transparent;background:rgba(127,127,127,.55)}
.sp.on{background:rgba(127,127,127,.2)}
.m code{background:rgba(127,127,127,.22);padding:0 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;direction:ltr;unicode-bidi:embed}
.m pre.code{background:rgba(0,0,0,.28);color:#e8f1f5;padding:8px 10px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;margin:4px 0;font-size:.88em}
.m a{color:inherit;text-decoration:underline;word-break:break-all}
.mn{color:var(--accent);font-weight:700}
.m.mine .mn{color:#fff;text-decoration:underline}
.bigemo{font-size:42px;line-height:1.2;animation:pop .35s}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.tk{font-size:11px;opacity:.8;margin-inline-start:3px}
.tk.read{color:#7fe3ff;opacity:1}
.m .file small{display:block;opacity:.7;font-size:11.5px}
.vp{display:flex;align-items:center;gap:8px;min-width:230px;position:relative}
.vpb{width:36px;height:36px;border-radius:50%;background:rgba(127,127,127,.28);display:grid;place-items:center;font-size:14px;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px;cursor:pointer;direction:rtl}
.wave i{flex:1;min-width:2px;background:currentColor;opacity:.35;border-radius:2px}
.wave i.on{opacity:1}
.vt{font-size:11.5px;opacity:.8;min-width:30px}
.vs{font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(127,127,127,.28)}
.vnew{position:absolute;top:-2px;inset-inline-start:-2px;width:8px;height:8px;border-radius:50%;background:#4fc3f7}
.emojis{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);max-height:120px;overflow:auto}
.emojis button{font-size:22px;width:38px;height:38px;border-radius:8px}
.emojis button:hover{background:var(--panel-2)}
#ctx{position:fixed;z-index:97;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:80vh;overflow:auto}
#ctx .cr{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#ctx .cr button{font-size:22px;width:36px;height:36px;border-radius:50%}
#ctx .cr button:hover,#ctx .ci:hover{background:var(--panel-2)}

async function cropImage(file, size, square) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let sw = img.width, sh = img.height, sx = 0, sy = 0, w, h;
    if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; w = h = size; }
    else { const k = Math.min(1, size / Math.max(sw, sh)); w = Math.round(sw * k); h = Math.round(sh * k); }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    return await new Promise(res => cv.toBlob(res, 'image/jpeg', .85));
  } finally { URL.revokeObjectURL(url); }
}

function fmt(t) {
  let s = esc(t).replace(/[\u0000-\u0008]/g, '');
  const blocks = [], codes = [];
  s = s.replace(/```([\s\S]+?)```/g, (_, c) => { blocks.push('<pre class="code">' + c.replace(/^\n/, '') + '</pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push('<code>' + c + '</code>'); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<i>$1</i>').replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/\|\|(.+?)\|\|/g, '<span class="sp">$1</span>');
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s(])@([A-Za-z][A-Za-z0-9_]{2,31})/g, '$1<span class="mn">@$2</span>');
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => codes[i]).replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

async function loadConvs() {
  const { data: mine } = await sb.from('conversation_members').select('conversation_id,last_read_at,is_pinned,is_archived,muted_until').eq('user_id', me.id);
  const ids = (mine || []).map(m => m.conversation_id);
  if (!ids.length) { convs = []; renderSide(); return; }
  const [cs, ms, last] = await Promise.all([
    sb.from('conversations').select('*').in('id', ids),
    sb.from('conversation_members').select('conversation_id,user_id,role,last_read_at').in('conversation_id', ids),
    sb.from('messages').select('id,conversation_id,sender_id,kind,body,created_at,deleted_at').in('conversation_id', ids).order('created_at', { ascending: false }).limit(400)
  ]);
  const recent = {};
  (last.data || []).forEach(m => (recent[m.conversation_id] ||= []).push(m));
  readBy = {};
  convs = (cs.data || []).map(c => {
    const mem = (ms.data || []).filter(m => m.conversation_id === c.id);
    const o = mem.find(m => m.user_id !== me.id);
    if (c.type === 'direct' && o) readBy[c.id] = o.last_read_at;
    return {
      ...c,
      members: mem.map(m => m.user_id),
      roles: Object.fromEntries(mem.map(m => [m.user_id, m.role])),
      mine: mine.find(m => m.conversation_id === c.id),
      last: (recent[c.id] || [])[0],
      recent: recent[c.id] || []
    };
  }).sort((a, b) => (b.mine && b.mine.is_pinned ? 1 : 0) - (a.mine && a.mine.is_pinned ? 1 : 0) || new Date(b.last_message_at) - new Date(a.last_message_at));
  renderSide();
}

/* ================= context menu / long press ================= */
function showCtx(x, y, reacts, items) {
  const m = $('#ctx');
  m.innerHTML = (reacts ? `<div class="cr">${reacts.map(e => `<button type="button" data-ce="${e}">${e}</button>`).join('')}</div>` : '') +
    items.map((it, i) => `<button type="button" class="ci" data-ci="${i}">${it[0]}</button>`).join('');
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  m._items = items; m._react = reacts ? emoji => toggleReaction(m._mid, emoji) : null;
}
function hideCtx() { const m = $('#ctx'); m.hidden = true; m._items = null; }
$('#ctx').addEventListener('click', e => {
  const m = $('#ctx');
  const ce = e.target.closest('[data-ce]'), ci = e.target.closest('[data-ci]');
  if (ce && m._react) { const f = m._react, em = ce.dataset.ce; hideCtx(); f(em); }
  if (ci && m._items) { const f = m._items[+ci.dataset.ci][1]; hideCtx(); f(); }
});
addEventListener('mousedown', e => { if (!$('#ctx').hidden && !e.target.closest('#ctx')) hideCtx(); });
addEventListener('scroll', hideCtx, true);
function bindLongPress(root, sel, fn) {
  let t = null, sx = 0, sy = 0;
  root.addEventListener('touchstart', e => {
    const el = e.target.closest(sel); if (!el || e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    t = setTimeout(() => { t = null; fn(el, sx, sy); }, 480);
  }, { passive: true });
  const cancel = () => { clearTimeout(t); t = null; };
  root.addEventListener('touchmove', e => { if (Math.abs(e.touches[0].clientX - sx) > 10 || Math.abs(e.touches[0].clientY - sy) > 10) cancel(); }, { passive: true });
  root.addEventListener('touchend', cancel); root.addEventListener('touchcancel', cancel);
}

/* ---------- voice player ---------- */
const speeds = [1, 1.5, 2];
async function voiceClick(el, e) {
  const box = el.closest('.vp'); const au = box.querySelector('audio');
  const act = el.dataset.vp;
  if (!au.src) { const u = await signed(au.dataset.path); if (u) au.src = u; }
  if (!au._bound) {
    au._bound = true;
    const bars = box.querySelectorAll('.wave i'), btn = box.querySelector('.vpb'), vt = box.querySelector('.vt');
    const dur = () => (isFinite(au.duration) && au.duration > 0 ? au.duration : +box.dataset.dur || 0);
    au.addEventListener('timeupdate', () => { const p = dur() ? au.currentTime / dur() : 0; bars.forEach((b, i) => b.classList.toggle('on', i / bars.length < p)); vt.textContent = fmtDur(au.currentTime); });
    au.addEventListener('play', () => { document.querySelectorAll('.vp audio').forEach(o => { if (o !== au) o.pause(); }); btn.textContent = '⏸'; });
    au.addEventListener('pause', () => { btn.textContent = '▶'; });
    au.addEventListener('ended', () => { btn.textContent = '▶'; bars.forEach(b => b.classList.remove('on')); vt.textContent = fmtDur(dur()); });
    au.addEventListener('play', () => { const nw = box.querySelector('.vnew'); if (nw) { nw.remove(); SAFE(() => { const a = JSON.parse(localStorage.getItem('kaftarHeard') || '[]'); a.push(box.dataset.vid); localStorage.setItem('kaftarHeard', JSON.stringify(a.slice(-300))); }); } }, { once: true });
  }
  if (act === 'play') { if (au.paused) au.play().catch(() => toast('پخش نشد')); else au.pause(); }
  if (act === 'speed') { const i = (speeds.indexOf(au.playbackRate) + 1) % speeds.length; au.playbackRate = speeds[i]; el.textContent = '×' + speeds[i]; }
  if (act === 'seek') {
    const rc = el.getBoundingClientRect(); const frac = 1 - (e.clientX - rc.left) / rc.width; // RTL: right edge is start
    const d = au.duration || +box.dataset.dur || 0; if (d) { au.currentTime = Math.max(0, Math.min(d, frac * d)); if (au.paused) au.play().catch(() => {}); }
  }
}

async function toggleReaction(mid, emoji) {

async function sendFile(file, forceKind, extra) {
  if (file.size > 25 * 1024 * 1024) return toast('حجم فایل بیش از ۲۵ مگابایت است');
  const ext = (file.name.split('.').pop() || 'bin').replace(/[^A-Za-z0-9]/g, '').slice(0, 8) || 'bin';
  const path = `${activeId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

  if (error) return toast('آپلود نشد');

  const kind = forceKind || (mt.startsWith('image/') ? 'image' : mt.startsWith('video/') ? 'video' : mt.startsWith('audio/') ? 'audio' : 'file');
  await insertMsg({ kind, body: file.name, attachment_path: path, metadata: { name: file.name, size: file.size, mime: mt, ...(extra || {}) } });

async function toggleRecord() {
  const btn = $('#recBtn');
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream); const chunks = []; const levels = [];
    let an = null, ac = null, iv = null;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)(); an = ac.createAnalyser(); an.fftSize = 512;
      ac.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      iv = setInterval(() => { an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) s += Math.abs(v - 128); levels.push(s / buf.length); sendTyping('voice'); }, 150);
    } catch (_) {}
    const t0 = Date.now();
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      clearInterval(iv); try { ac && ac.close(); } catch (_) {}
      stream.getTracks().forEach(t => t.stop());
      recorder = null; btn.classList.remove('rec'); btn.innerHTML = icon('mic');
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
      const dur = (Date.now() - t0) / 1000;
      const N = 36, wave = [];
      for (let i = 0; i < N; i++) { const a = levels.slice(Math.floor(i * levels.length / N), Math.max(Math.floor((i + 1) * levels.length / N), Math.floor(i * levels.length / N) + 1)); const v = a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; wave.push(Math.round(Math.min(100, 12 + v * 9))); }
      if (blob.size > 800) sendFile(new File([blob], 'voice.webm', { type: blob.type }), 'voice', { dur: Math.round(dur), wave });
    };
    rec.start(); recorder = rec; btn.classList.add('rec'); btn.innerHTML = icon('send');
    toast('در حال ضبط… برای ارسال دوباره بزنید');
  } catch (_) { toast('دسترسی به میکروفون داده نشد'); }
}

/* ================= realtime ================= */
let typingCh = null;
function subscribe() {
  sb.channel('kaftar-db')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, onMsg)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'message_reactions' }, onReact)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversation_members' }, refreshConvs)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, refreshConvs)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pinned_messages' }, () => { if (activeId) loadPins().then(() => renderMsgs()); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => loadStories())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, onProfile)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calls' }, onCall)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_signals' }, p => onSignal(p.new))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'call_participants' }, p => { if (call && p.new && p.new.call_id === call.id) syncParticipants(); const r = p.new || p.old; if (r && !call) updateBanner(); })
    .subscribe();
  typingCh = sb.channel('kaftar-typing', { config: { broadcast: { self: false } } });
  typingCh.on('broadcast', { event: 'typing' }, ({ payload }) => {
    if (!payload || payload.user === me.id) return;
    typingMap[payload.conv] = { kind: payload.kind, until: Date.now() + 4000 };
    if (payload.conv === activeId) renderHeader();
    renderSide();
    setTimeout(() => { if (typingMap[payload.conv] && Date.now() >= typingMap[payload.conv].until) { if (payload.conv === activeId) renderHeader(); renderSide(); } }, 4100);
  }).subscribe();
}
let actx = null;
function playSound(kind) {
  if (ui.sound === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = kind === 'send' ? 520 : 780; g.gain.value = .05;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (kind === 'send' ? .07 : .14));
  } catch (_) {}
}
function onMsg(p) {
  const row = p.new;
  if (p.eventType === 'DELETE') return;
  if (p.eventType === 'INSERT') {
    const c = convs.find(x => x.id === row.conversation_id);
    if (row.conversation_id === activeId) {
      if (!msgs.some(m => m.id === row.id)) { msgs.push(row); upsertMsg(row); }
      if (row.sender_id !== me.id) { markRead(); if (document.hidden) notifyMsg(row, c); else playSound('in'); }
    } else if (row.sender_id !== me.id) {
      if (!c || !isMuted(c)) { playSound('in'); notifyMsg(row, c); toast('پیام تازه از ' + nameOf(row.sender_id)); }
    }
    refreshConvs();
  } else if (p.eventType === 'UPDATE') {
    const i = msgs.findIndex(m => m.id === row.id);
    if (i >= 0) { msgs[i] = row; upsertMsg(row); }
    refreshConvs();
  }
}
function notifyMsg(row, c) {
  if (!settings.notifications_enabled || !document.hidden || !window.Notification || Notification.permission !== 'granted') return;
  if (c && isMuted(c)) return;
  SAFE(() => new Notification(nameOf(row.sender_id), { body: row.body || previewKind(row) || 'پیام جدید', tag: row.conversation_id }));
}
function onReact(p) {
  const r = p.eventType === 'DELETE' ? p.old : p.new;
  if (!r || !msgs.some(m => m.id === r.message_id)) return;
  const list = reactions[r.message_id] ||= [];
  if (p.eventType === 'INSERT') { if (!list.some(x => x.user_id === r.user_id && x.emoji === r.emoji)) list.push(r); }
  else reactions[r.message_id] = list.filter(x => !(x.user_id === r.user_id && x.emoji === r.emoji));
  const m = msgs.find(x => x.id === r.message_id); if (m) upsertMsg(m);
}
async function onProfile(p) {
  if (p.new) profiles[p.new.id] = p.new;
  else if (p.old) delete profiles[p.old.id];
  if (p.eventType === 'INSERT') renderSide();
  if (tab === 'users') renderSide();
  renderHeader();
}

/* ================= calls (WebRTC mesh: 1-to-1 + group) ================= */
let call = null;       // my active / outgoing call
let incoming = null;   // ringing call shown to me
let starting = false;
let ringIv = null, ringCtx = null;
let iceP = null, ICE_CFG = { iceServers: DEFAULT_ICE };

const ensureIce = () => iceP || (iceP = (async () => {
  try {
    const r = await Promise.race([sb.functions.invoke('ice-servers'), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3500))]);
    const list = r && r.data && r.data.iceServers;
    if (list && list.length) ICE_CFG = { iceServers: r.data.custom ? list : list.concat(PUBLIC_TURN) };
  } catch (_) {}
})());

function ringStart() {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      [0, .35].forEach(d => {
        const o = ringCtx.createOscillator(), g = ringCtx.createGain();
        o.frequency.value = 880; g.gain.value = .08;
        o.connect(g); g.connect(ringCtx.destination);
        o.start(ringCtx.currentTime + d); o.stop(ringCtx.currentTime + d + .22);
      });
    };
    beep(); ringIv = setInterval(beep, 2000);
  } catch (_) {}
}
function ringStop() { clearInterval(ringIv); ringIv = null; }

async function getMedia(kind) {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: kind === 'video' ? { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 } } : false });
  } catch (e) {
    toast(kind === 'video' ? 'دسترسی به دوربین یا میکروفون داده نشد' : 'دسترسی به میکروفون داده نشد');
    return null;
  }
}

/* ---------- call screen ---------- */
function newCall(o) {
  return Object.assign({
    peers: new Map(), seen: new Set(), sid: Math.random().toString(36).slice(2, 10),
    minSig: 0, myJoined: null, timer: null, tick: null, poll: null, pollN: 0,
    connected: false, sigErr: false, syncing: false, dbg: ''
  }, o);
}
function showCallUI() {
  const name = call.group ? call.title : nameOf(call.otherUid);
  $('#callui').hidden = false;
  $('#callui').classList.toggle('grp', !!call.group);
  $('#callAv').outerHTML = avatar(name, false).replace('class="av', 'id="callAv" class="av');
  $('#callName').textContent = name;

  $('#btnMute').className = 'cb'; $('#btnMute').innerHTML = icon('mic');
  $('#btnCam').className = 'cb'; $('#btnCam').innerHTML = icon('video');

}
function setCallStatus(t) {

}
const tileOf = uid => document.querySelector('#tiles .tile[data-uid="' + uid + '"]');
function ensureTile(uid) {
  let t = tileOf(uid); if (t) return t;
  const nm = uid === 'me' ? 'شما' : nameOf(uid);
  t = document.createElement('div');
  t.className = 'tile novid' + (uid === 'me' ? ' me' : '');
  t.dataset.uid = uid;
  t.innerHTML = avatar(nm, false) + '<video autoplay playsinline></video><span class="tn"></span><span class="ts"></span>';
  t.querySelector('.tn').textContent = nm;
  const v = t.querySelector('video');
  if (uid === 'me') { v.muted = true; v.srcObject = call.stream; if (call.kind === 'video') t.classList.remove('novid'); }
  $('#tiles').appendChild(t);
  return t;
}
function layoutTiles() { $('#tiles').classList.toggle('solo', !call.group); }
function setTileStatus(peer, text) {
  if (!call) return;
  if (call.group) { const t = tileOf(peer.uid); if (t) t.querySelector('.ts').textContent = text || ''; }
  else if (text) setCallStatus(text);
}
function attachStream(peer) {
  const t = tileOf(peer.uid); if (!t || !peer.stream) return;
  const v = t.querySelector('video');
  if (v.srcObject !== peer.stream) v.srcObject = peer.stream;
  t.classList.toggle('novid', !(call.kind === 'video' && peer.stream.getVideoTracks().length));
  v.play().catch(() => {});
}
function renderDiag() {
  const el = $('#diag'); if (!el) return;
  if (!call) { el.textContent = ''; return; }
  const parts = [];
  call.peers.forEach(p => parts.push((call.group ? nameOf(p.uid) + ' ' : '') + (p.pc ? p.pc.iceConnectionState : 'waiting') + ' [host ' + p.cand.host + ' · stun ' + p.cand.srflx + ' · relay ' + p.cand.relay + ']'));
  el.textContent = parts.join(' | ') + (call.dbg ? ' | ' + call.dbg : '');
}
function diag(t) { if (call) { call.dbg = t; renderDiag(); } }

/* ---------- signaling ---------- */
async function sendSignal(kind, to, data) {
  const c = call; if (!c) return;
  const { error } = await sb.from('call_signals').insert({ call_id: c.id, from_user: me.id, to_user: to, kind, payload: { sid: c.sid, d: data || {} } });
  if (error && !c.sigErr) { c.sigErr = true; toast('ارسال سیگنال تماس ناموفق بود'); diag('signal error: ' + error.message); }
}
function onSignal(row) {
  if (!call || !row || row.call_id !== call.id) return;
  const id = Number(row.id);
  if (id <= call.minSig || call.seen.has(id)) return;
  call.seen.add(id);
  if (row.from_user === me.id) return;
  if (row.to_user && row.to_user !== me.id) return;
  const peer = getPeer(row.from_user);
  peer.q = peer.q.then(() => handleSignal(peer, row)).catch(e => diag(row.kind + ': ' + (e && e.message || e)));
}

/* ---------- peers ---------- */
function getPeer(uid) {
  let p = call.peers.get(uid);
  if (p) return p;
  p = { uid, sid: null, pc: null, polite: me.id < uid, making: false, offerer: false, pendingIce: [], outIce: [], descSent: false, q: Promise.resolve(), stream: null, connTimer: null, restarted: false, cand: { host: 0, srflx: 0, relay: 0 } };
  call.peers.set(uid, p);
  ensureTile(uid); layoutTiles();
  clearTimeout(call.timer);
  if (!call.connected) setCallStatus('در حال اتصال…');
  return p;
}
function closePC(peer) {
  clearTimeout(peer.connTimer);
  if (peer.pc) { const pc = peer.pc; peer.pc = null; try { pc.close(); } catch (_) {} }
  peer.stream = null; peer.descSent = false; peer.outIce = []; peer.pendingIce = []; peer.making = false; peer.offerer = false;
  const t = tileOf(peer.uid); if (t) { t.querySelector('video').srcObject = null; t.classList.add('novid'); }
}
function removePeer(uid) {
  const p = call && call.peers.get(uid); if (!p) return;
  closePC(p); call.peers.delete(uid);
  const t = tileOf(uid); if (t) t.remove();
  renderDiag();
}
function makePC(peer) {
  closePC(peer);
  const pc = new RTCPeerConnection(ICE_CFG);
  peer.pc = pc; peer.cand = { host: 0, srflx: 0, relay: 0 };
  call.stream.getTracks().forEach(t => pc.addTrack(t, call.stream));
  pc.ontrack = e => {
    if (peer.pc !== pc) return;
    peer.stream = peer.stream || new MediaStream();
    if (!peer.stream.getTracks().includes(e.track)) peer.stream.addTrack(e.track);
    attachStream(peer);
  };
  pc.onicecandidate = e => {
    if (peer.pc !== pc || !e.candidate) return;
    const m = / typ (host|srflx|prflx|relay)/.exec(e.candidate.candidate || '');
    const k = m ? (m[1] === 'prflx' ? 'srflx' : m[1]) : 'host';
    peer.cand[k]++;
    if (peer.descSent) sendSignal('ice', peer.uid, e.candidate.toJSON()); else peer.outIce.push(e.candidate.toJSON());
    renderDiag();
  };
  pc.oniceconnectionstatechange = () => { if (peer.pc === pc) { renderDiag(); onPeerState(peer); } };
  pc.onconnectionstatechange = () => { if (peer.pc === pc) onPeerState(peer); };

}
const gatherDone = (pc, ms) => new Promise(res => {
  if (pc.iceGatheringState === 'complete') return res();
  let t;
  const done = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', chk); res(); };
  const chk = () => { if (pc.iceGatheringState === 'complete') done(); };
  t = setTimeout(done, ms);
  pc.addEventListener('icegatheringstatechange', chk);
});
const descOf = pc => ({ type: pc.localDescription.type, sdp: pc.localDescription.sdp });
function flushOut(peer) { peer.outIce.splice(0).forEach(c => sendSignal('ice', peer.uid, c)); }
async function flushIce(peer) {
  const list = peer.pendingIce.splice(0);
  for (const c of list) { try { await peer.pc.addIceCandidate(c); } catch (_) {} }
}

async function sendOffer(peer, restart) {
  if (!restart || !peer.pc) makePC(peer);
  peer.offerer = true; peer.making = true;
  const pc = peer.pc;
  try {
    const offer = await pc.createOffer(restart ? { iceRestart: true } : undefined);
    await pc.setLocalDescription(offer);
    await gatherDone(pc, 2500);
    if (peer.pc !== pc || !call) return;
    await sendSignal('offer', peer.uid, descOf(pc));
    peer.descSent = true; flushOut(peer);
  } finally { peer.making = false; }
}
async function handleSignal(peer, row) {
  if (!call) return;
  const d = (row.payload && row.payload.d) || {}, sid = row.payload && row.payload.sid;
  if (row.kind === 'hangup') {
    if (peer.sid && sid && sid !== peer.sid) return;
    if (!call.group) cleanupCall('تماس پایان یافت'); else { toast(nameOf(peer.uid) + ' تماس را ترک کرد'); removePeer(peer.uid); }
    return;
  }
  if (row.kind === 'offer') {
    if (peer.sid && sid !== peer.sid) closePC(peer);       // peer started a fresh session
    peer.sid = sid;
    const collision = peer.making || (peer.pc && peer.pc.signalingState !== 'stable');
    if (collision && !peer.polite) return;                  // impolite side ignores the colliding offer
    if (!peer.pc) makePC(peer);
    if (collision) { peer.descSent = false; peer.outIce = []; }
    peer.offerer = false;
    const pc = peer.pc;
    await pc.setRemoteDescription(d);
    await flushIce(peer);
    await pc.setLocalDescription(await pc.createAnswer());
    await gatherDone(pc, 2000);
    if (peer.pc !== pc || !call) return;
    await sendSignal('answer', peer.uid, descOf(pc));
    peer.descSent = true; flushOut(peer);
  } else if (row.kind === 'answer') {

    peer.sid = sid;
    await peer.pc.setRemoteDescription(d);
    await flushIce(peer);
  } else if (row.kind === 'ice') {
    if (peer.sid && sid && sid !== peer.sid) return;
    if (peer.pc && peer.pc.remoteDescription) { try { await peer.pc.addIceCandidate(d); } catch (_) {} }
    else peer.pendingIce.push(d);

function startTimer() {
  const t0 = Date.now();
  if (!call.group && call.kind === 'video') $('#callinfo').hidden = true;
  clearInterval(call.tick);
  const upd = () => { const s = Math.floor((Date.now() - t0) / 1000); setCallStatus(String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + (call.group ? ' · ' + (call.peers.size + 1) + ' نفر' : '')); };
  upd(); call.tick = setInterval(() => call ? upd() : 0, 1000);
}
function onPeerState(peer) {
  if (!call || !peer.pc) return;
  const pc = peer.pc, cs = pc.connectionState, is = pc.iceConnectionState;
  if (cs === 'connected' || is === 'connected' || is === 'completed') {
    clearTimeout(peer.connTimer); peer.restarted = false; setTileStatus(peer, '');
    if (!call.connected) { call.connected = true; startTimer(); }
    return;
  }
  if (cs === 'failed' || is === 'failed') {
    if (peer.offerer && !peer.restarted) { peer.restarted = true; setTileStatus(peer, 'تلاش دوباره…'); sendOffer(peer, true).catch(() => {}); return; }
    peerFailed(peer);
    return;
  }
  if (is === 'disconnected') setTileStatus(peer, 'اتصال ضعیف…');
}
const failHint = peer => (peer.cand.srflx + peer.cand.relay === 0)
  ? 'آدرس عمومی پیدا نشد؛ اینترنت یا فیلترینگ اجازهٔ تماس مستقیم نمی‌دهد (سرور TURN لازم است).'
  : 'اتصال مستقیم برقرار نشد (سرور TURN لازم است).';
function peerFailed(peer) {
  if (!call) return;

  else { toast(failHint(peer)); endCall('failed'); }
}
function peerTimeout(peer) {
  if (!call || !peer.pc) return;
  const cs = peer.pc.connectionState, is = peer.pc.iceConnectionState;
  if (cs === 'connected' || is === 'connected' || is === 'completed') return;
  peerFailed(peer);
}

/* participants: who is in the call, and who must send the offer (the later joiner offers) */
async function syncParticipants() {
  const c = call; if (!c || c.syncing) return;
  c.syncing = true;
  try {
    const { data, error } = await sb.from('call_participants').select('user_id,joined_at,left_at').eq('call_id', c.id);
    if (error || !data || call !== c) return;
    const mine = data.find(r => r.user_id === me.id); if (!mine) return;
    c.myJoined = mine.joined_at;
    for (const r of data) {
      if (r.user_id === me.id) continue;
      if (r.left_at) {
        if (!c.group) { if (c.peers.has(r.user_id) && c.peers.get(r.user_id).sid) { cleanupCall('تماس پایان یافت'); return; } continue; }
        if (c.peers.has(r.user_id)) removePeer(r.user_id);
        continue;
      }
      const peer = getPeer(r.user_id);
      if (peer.pc) continue;
      const theyLater = r.joined_at > c.myJoined || (r.joined_at === c.myJoined && r.user_id > me.id);
      if (!theyLater) sendOffer(peer, false).catch(e => diag('offer: ' + (e && e.message || e)));
    }
  } finally { c.syncing = false; }
}
function startLoops() {
  call.poll = setInterval(async () => {
    const c = call; if (!c) return;
    c.pollN++;
    const { data } = await sb.from('call_signals').select('*').eq('call_id', c.id).gt('id', c.minSig).order('id').limit(300);
    if (call === c) (data || []).forEach(onSignal);
    if (call === c && c.pollN % 2 === 0) syncParticipants();
  }, 1500);
  syncParticipants();
}

/* ---------- start / join / end ---------- */
async function startCall(kind) {
  const c = active(); if (!c || starting) return;
  if (call || incoming) return toast('یک تماس دیگر در جریان است');
  if (!window.RTCPeerConnection || !navigator.mediaDevices) return toast('مرورگر شما از تماس پشتیبانی نمی‌کند. سایت باید با https باز شود.');
  starting = true;
  try {
    const stream = await getMedia(kind); if (!stream) return;
    await ensureIce();
    const { data: id, error } = await sb.rpc('start_call', { conv: c.id, kind });
    if (error) { stream.getTracks().forEach(t => t.stop()); return toast('شروع تماس ممکن نشد'); }
    call = newCall({ id, kind, group: c.type === 'group', convId: c.id, stream, isCaller: true, title: convTitle(c), otherUid: c.type === 'direct' ? otherId(c) : null });
    showCallUI();
    setCallStatus('در حال زنگ زدن…');
    call.timer = setTimeout(() => { if (call && !call.peers.size) endCall('timeout'); }, 45000);
    startLoops();
  } finally { starting = false; }
}
async function joinCall(row) {

  starting = true;
  try {
    const stream = await getMedia(row.call_type);
    if (!stream) { if (!row.is_group) await sb.rpc('decline_call', { call: row.id }).then(() => {}); return; }
    await ensureIce();
    const conv = convs.find(x => x.id === row.conversation_id);
    call = newCall({ id: row.id, kind: row.call_type, group: !!row.is_group, convId: row.conversation_id, stream, isCaller: false, title: conv ? convTitle(conv) : 'تماس گروهی', otherUid: row.caller_id });
    showCallUI();
    setCallStatus('در حال اتصال…');
    // ignore signals that already exist (they belong to other sessions)
    const { data: last } = await sb.from('call_signals').select('id').eq('call_id', row.id).order('id', { ascending: false }).limit(1);
    call.minSig = last && last[0] ? Number(last[0].id) : 0;
    const { error } = await sb.rpc('answer_call', { call: row.id, with_video: row.call_type === 'video' });
    if (error) { toast('پیوستن به تماس ممکن نشد'); cleanupCall(); return; }
    startLoops();
  } finally { starting = false; }
}
async function endCall(reason) {
  if (!call) return;
  const id = call.id, group = call.group, other = call.otherUid;
  try { await sendSignal('hangup', group ? null : other, {}); } catch (_) {}
  cleanupCall('');
  await sb.rpc('end_call', { call: id, reason: reason || 'hangup' });
}
function cleanupCall(msg) {
  if (!call) return;
  const c = call; call = null;
  clearTimeout(c.timer); clearInterval(c.tick); clearInterval(c.poll);
  c.peers.forEach(p => { try { closePC(p); } catch (_) {} });
  c.stream.getTracks().forEach(t => t.stop());
  $('#tiles').innerHTML = '';
  $('#callui').hidden = true;
  $('#diag').textContent = '';
  if (msg) toast(msg);
  updateBanner();
}

/* ---------- incoming ---------- */
function onCall(p) {
  const row = p.new; if (!row) return;
  if (p.eventType === 'INSERT') {
    if (row.caller_id !== me.id && row.status === 'ringing') showIncoming(row);
    if (row.conversation_id === activeId) updateBanner();
    return;
  }
  if (call && row.id === call.id && ['ended', 'missed', 'declined'].includes(row.status)) cleanupCall(row.status === 'declined' ? 'تماس رد شد' : 'تماس پایان یافت');
  if (incoming && row.id === incoming.id && (row.is_group ? !['ringing', 'active'].includes(row.status) : row.status !== 'ringing')) hideIncoming();
  if (row.conversation_id === activeId) updateBanner();
}
function showIncoming(row) {
  if (call || incoming || starting) { if (!row.is_group) sb.rpc('decline_call', { call: row.id }).then(() => {}); return; }
  incoming = row;
  const n = nameOf(row.caller_id);
  const conv = convs.find(x => x.id === row.conversation_id);
  $('#incAv').outerHTML = avatar(n, false).replace('class="av', 'id="incAv" class="av');
  $('#incName').textContent = row.is_group && conv ? convTitle(conv) + ' · ' + n : n;
  $('#incKind').textContent = (row.is_group ? 'تماس گروهی ' : 'تماس ') + (row.call_type === 'video' ? 'تصویری' : 'صوتی');
  $('#incoming').hidden = false;
  ringStart();
  clearTimeout(incTimer); incTimer = setTimeout(() => { if (incoming && incoming.id === row.id) hideIncoming(); }, 45000);
}
let incTimer = null;
function hideIncoming() { clearTimeout(incTimer); incoming = null; $('#incoming').hidden = true; ringStop(); }
async function checkRinging() {
  const since = new Date(Date.now() - 40000).toISOString();
  const { data } = await sb.from('calls').select('*').eq('status', 'ringing').gt('started_at', since).neq('caller_id', me.id).order('started_at', { ascending: false }).limit(1);
  if (data && data[0]) showIncoming(data[0]);
}
$('#incNo').onclick = async () => { const row = incoming; hideIncoming(); if (row && !row.is_group) await sb.rpc('decline_call', { call: row.id }); };
$('#incYes').onclick = async () => { const row = incoming; if (!row) return; hideIncoming(); await joinCall(row); };

/* banner: an ongoing group call you can join */
async function updateBanner() {
  const b = $('#callBanner'); if (!b) return;
  const c = active(), id = activeId;
  if (!c || c.type !== 'group') { b.hidden = true; return; }
  const { data } = await sb.from('calls').select('*').eq('conversation_id', id).in('status', ['ringing', 'active']).order('started_at', { ascending: false }).limit(1);
  if (id !== activeId) return;
  const row = data && data[0];
  if (!row || (call && call.id === row.id) || (row.status === 'ringing' && Date.now() - Date.parse(row.started_at) > 60000)) { b.hidden = true; return; }
  const { data: ps } = await sb.from('call_participants').select('user_id').eq('call_id', row.id).is('left_at', null);
  if (id !== activeId) return;
  if (!ps || !ps.length) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<span>📞 تماس گروهی ' + (row.call_type === 'video' ? 'تصویری' : 'صوتی') + ' در جریان است (' + ps.length + ' نفر)</span><button class="btn" type="button" id="bJoin">پیوستن</button>';
  $('#bJoin').onclick = () => joinCall(row);
}

/* ---------- controls ---------- */
$('#btnHang').onclick = () => endCall('hangup');
$('#btnMute').onclick = () => {
  if (!call) return;
  const t = call.stream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $('#btnMute').className = 'cb' + (t.enabled ? '' : ' off');
  $('#btnMute').innerHTML = icon(t.enabled ? 'mic' : 'micOff');
  syncMedia();
};
$('#btnCam').onclick = () => {
  if (!call) return;
  const t = call.stream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $('#btnCam').className = 'cb' + (t.enabled ? '' : ' off');
  $('#btnCam').innerHTML = icon(t.enabled ? 'video' : 'videoOff');
  const me_ = tileOf('me'); if (me_) me_.classList.toggle('novid', !t.enabled);
  syncMedia();
};
$('#callui').addEventListener('click', () => document.querySelectorAll('#tiles video').forEach(v => v.play().catch(() => {})));
function syncMedia() {
  const a = call.stream.getAudioTracks()[0], v = call.stream.getVideoTracks()[0];
  sb.rpc('set_call_media', { call: call.id, muted: !(a && a.enabled), video_on: !!(v && v.enabled), screen_sharing: false }).then(() => {});
}
// best effort: leave the call when the tab is closed
addEventListener('pagehide', () => {
  if (!call) return;
  try {
    fetch(SUPABASE_URL + '/rest/v1/rpc/end_call', { method: 'POST', keepalive: true, headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (authTok || SUPABASE_KEY), 'Content-Type': 'application/json' }, body: JSON.stringify({ call: call.id, reason: 'hangup' }) });
  } catch (_) {}
});

/* ================= image viewer ================= */
const lb = { list: [], i: 0 };
async function openLightbox(path) {
  lb.list = msgs.filter(m => m.kind === 'image' && m.attachment_path && !m.deleted_at);
  lb.i = Math.max(0, lb.list.findIndex(m => m.attachment_path === path));
  $('#lb').hidden = false;
  document.body.style.overflow = 'hidden';
  await showLb();
}
async function showLb() {
  const m = lb.list[lb.i]; if (!m) return closeLb();
  const my = lb.i, img = $('#lbImg');
  img.classList.remove('zoom'); img.removeAttribute('src');
  const name = (m.metadata && m.metadata.name) || 'image';
  $('#lbCap').textContent = name + (lb.list.length > 1 ? '  (' + (lb.i + 1) + ' / ' + lb.list.length + ')' : '');
  $('#lbPrev').hidden = lb.i <= 0; $('#lbNext').hidden = lb.i >= lb.list.length - 1;
  const u = await signed(m.attachment_path);
  if (my !== lb.i) return;
  if (!u) return toast('باز کردن تصویر ممکن نشد');
  img.src = u;
  const d = await signed(m.attachment_path, { download: name });
  if (my === lb.i && d) $('#lbDl').href = d;
}
function closeLb() { $('#lb').hidden = true; $('#lbImg').removeAttribute('src'); document.body.style.overflow = ''; }
const lbGo = n => { const j = lb.i + n; if (j < 0 || j >= lb.list.length) return; lb.i = j; showLb(); };
$('#lbX').innerHTML = icon('x');
$('#lbPrev').onclick = () => lbGo(-1);
$('#lbNext').onclick = () => lbGo(1);
$('#lbImg').onclick = e => { e.stopPropagation(); $('#lbImg').classList.toggle('zoom'); };
$('#lbX').onclick = closeLb;
$('#lbStage').onclick = e => { if (e.target === $('#lbStage')) closeLb(); };
addEventListener('keydown', e => {
  if ($('#lb').hidden) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') lbGo(-1);
  if (e.key === 'ArrowLeft') lbGo(1);
});
let lbX = null;
$('#lbStage').addEventListener('touchstart', e => { lbX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$('#lbStage').addEventListener('touchend', e => {
  if (lbX == null || $('#lbImg').classList.contains('zoom')) return;
  const dx = e.changedTouches[0].clientX - lbX; lbX = null;
  if (Math.abs(dx) > 60) lbGo(dx > 0 ? -1 : 1);
}, { passive: true });

})();
</script>
